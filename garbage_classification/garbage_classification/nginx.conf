events {}

http {
    resolver 127.0.0.11 valid=5s;   # Docker's embedded DNS

    server {
        listen 80;

        location / {
            # "api" resolves to ALL replica IPs; Docker's DNS round-robins them
            set $upstream http://api:8000;
            proxy_pass $upstream;
            proxy_read_timeout 60s;
        }
    }
}
